stages:
  - test
 
default:
  image: node:22
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
 
newman_api_tests:
  stage: test
  script:
    - npm install
    - npm run test:api:ci
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/
    reports:
      junit: reports/newman-junit.xml
 